<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sim-go preview</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; max-width: 1100px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #doctor { color: #666; font-size: 13px; margin-bottom: 16px; }
  .layout { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  #devices { min-width: 280px; flex: 1; }
  #panel { flex: 2; min-width: 320px; }
  .dev { border: 1px solid #ccc; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
  .dev.sel { border-color: #06c; background: rgba(0,102,204,.06); }
  .dev .st { font-size: 12px; color: #666; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
  button { padding: 6px 10px; border-radius: 6px; border: 1px solid #bbb; background: #f5f5f5; cursor: pointer; }
  button:hover { background: #e8e8e8; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=text] { padding: 6px 8px; border-radius: 6px; border: 1px solid #bbb; }
  #view { max-width: 100%; max-height: 70vh; border: 1px solid #ccc; border-radius: 8px; touch-action: none; cursor: crosshair; background: #111; }
  #status { font-size: 13px; color: #666; min-height: 1.4em; }
  #err { color: #b00; min-height: 1.4em; font-size: 13px; white-space: pre-wrap; }
  #okline { color: #0a0; min-height: 1.4em; font-size: 13px; }
  fieldset { border: 1px solid #ccc; border-radius: 8px; margin: 8px 0; }
  legend { font-size: 12px; color: #666; padding: 0 6px; }
  .note { font-size: 13px; color: #666; }
</style>
</head>
<body>
<h1>sim-go preview</h1>
<div id="doctor">…</div>
<div class="layout">
  <div id="devices">
    <div class="row"><button id="refresh">Refresh devices</button></div>
    <div id="list"></div>
  </div>
  <div id="panel">
    <div id="sel">Select a device.</div>
    <div id="err"></div>
    <div id="okline"></div>
    <div id="ctl" hidden>
      <div class="row">
        <button data-op="boot">Boot</button>
        <button data-op="shutdown">Shutdown</button>
        <button data-op="slim">Slim</button>
        <button data-op="restore">Restore</button>
        <button data-op="normalize">Normalize</button>
      </div>
      <div id="streambox" hidden>
        <div class="row">
          <button id="connect">Connect live</button>
          <button id="disconnect" disabled>Disconnect</button>
          <span id="status">disconnected</span>
        </div>
        <div><canvas id="view"></canvas></div>
        <div class="note">Live H.264 for both platforms (scrcpy on Android, idb on iOS). Decoded in-page, never screenshotted.</div>
      </div>
      <fieldset><legend>Apps</legend>
        <div class="row">
          <input type="text" id="app" placeholder="bundle id / package" size="28">
          <button id="launch">Launch</button>
          <button id="term">Terminate</button>
        </div>
      </fieldset>
      <fieldset><legend>Input</legend>
        <div class="row">
          <input type="text" id="typetext" placeholder="text to type" size="20">
          <button id="type">Type</button>
          <input type="text" id="keycode" placeholder="keycode: 4" size="10">
          <button id="key">Key</button>
          <input type="text" id="pressbtn" placeholder="button: home" size="12">
          <button id="press">Press</button>
        </div>
        <div class="row">
          <input type="text" id="url" placeholder="https://… or deep link" size="34">
          <button id="openurl">Open URL</button>
        </div>
        <div class="note">Canvas gestures drive the live stream. The forms use the same SDK verbs over HTTP.</div>
      </fieldset>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const errBox = $('err'), okBox = $('okline');
let sel = null;

// ---------- helpers ----------
function err(m) { errBox.textContent = m; okBox.textContent = ''; }
function ok(m) { okBox.textContent = m; errBox.textContent = ''; }
async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'failed');
  return j;
}
async function loadDoctor() {
  try { const d = await (await fetch('/api/doctor')).json(); $('doctor').textContent = d.detail || JSON.stringify(d); }
  catch (e) { $('doctor').textContent = 'doctor failed: ' + e.message; }
}
async function loadDevices() {
  const list = $('list'); list.innerHTML = '';
  let devs;
  try { devs = await (await fetch('/api/devices')).json(); }
  catch (e) { err('list failed: ' + e.message); return; }
  if (!devs.length) { list.textContent = 'No devices.'; return; }
  for (const d of devs) {
    const el = document.createElement('div');
    el.className = 'dev' + (sel && sel.id === d.id ? ' sel' : '');
    el.innerHTML = '<b></b> <span class="st"></span>';
    el.querySelector('b').textContent = d.platform + ' · ' + d.name;
    el.querySelector('.st').textContent = d.id + ' · ' + d.state + (d.os ? ' · ' + d.os : '');
    el.onclick = () => select(d);
    list.appendChild(el);
  }
}

// ---------- selection ----------
function select(d) {
  disconnect();
  sel = d;
  $('sel').textContent = d.platform + ' · ' + d.name + ' (' + d.state + ')';
  $('ctl').hidden = false;
  $('streambox').hidden = false;
  loadDevices();
}
$('refresh').onclick = loadDevices;
document.querySelectorAll('#ctl button[data-op]').forEach(b => {
  b.onclick = async () => {
    if (!sel) return;
    try { await api('/api/' + b.dataset.op, { platform: sel.platform, id: sel.id }); ok(b.dataset.op + ': ok'); loadDevices(); }
    catch (e) { err(b.dataset.op + ': ' + e.message); }
  };
});
async function appOp(path) {
  const app = $('app').value.trim();
  if (!sel || !app) return;
  try { const j = await api(path, { platform: sel.platform, id: sel.id, app }); ok('ok' + (j.output ? ' ' + j.output : '')); }
  catch (e) { err(e.message); }
}
$('launch').onclick = () => appOp('/api/launch');
$('term').onclick = () => appOp('/api/terminate');
$('type').onclick = async () => {
  if (!sel) return;
  try { await api('/api/type', { platform: sel.platform, id: sel.id, text: $('typetext').value }); ok('type: ok'); }
  catch (e) { err('type: ' + e.message); }
};
$('key').onclick = async () => {
  if (!sel) return;
  const code = parseInt($('keycode').value.trim() || '4', 10);
  try { await api('/api/key', { platform: sel.platform, id: sel.id, code: String(code) }); ok('key: ok'); }
  catch (e) { err('key: ' + e.message); }
};
$('press').onclick = async () => {
  if (!sel) return;
  try { await api('/api/press', { platform: sel.platform, id: sel.id, button: $('pressbtn').value.trim() || 'home' }); ok('press: ok'); }
  catch (e) { err('press: ' + e.message); }
};
$('openurl').onclick = async () => {
  if (!sel || !$('url').value.trim()) return;
  try { await api('/api/open-url', { platform: sel.platform, id: sel.id, url: $('url').value.trim() }); ok('open-url: ok'); }
  catch (e) { err('open-url: ' + e.message); }
};

// ---------- live H.264 stream (android + ios) ----------
let ws = null, decoder = null, streamW = 0, streamH = 0, seq = 0, gotFrame = false;
const canvas = $('view'), statusEl = $('status');

function setStatus(s) { statusEl.textContent = s; }
// needKey is true while the decoder has no picture yet, or after a reconfigure:
// the next chunk must be a keyframe or WebCodecs throws.
let needKey = true;
function closeDecoder() { try { decoder && decoder.close(); } catch (_) {} decoder = null; needKey = true; }

function ensureDecoder(codec, desc) {
  if (decoder) return true;
  if (typeof VideoDecoder === 'undefined') { err('WebCodecs unavailable in this browser'); return false; }
  try {
    decoder = new VideoDecoder({
      output(frame) {
        canvas.width = frame.displayWidth; canvas.height = frame.displayHeight;
        canvas.getContext('2d').drawImage(frame, 0, 0);
        frame.close();
        if (!gotFrame) { gotFrame = true; setStatus('streaming'); }
      },
      error(e) { err('decoder: ' + e.message); disconnect(); }
    });
    decoder.configure({ codec, description: desc });
    return true;
  } catch (e) { err('decoder configure (' + codec + '): ' + e.message); decoder = null; return false; }
}

function onBinary(buf) {
  const tag = buf[0], payload = buf.slice(1);
  if (tag === 1) { pendingDesc = payload; return; } // description; decode starts on first keyframe
  if (!decoder && !(pendingCodec && pendingDesc)) return; // config not complete yet
  if (!ensureDecoder(pendingCodec, pendingDesc)) return;
  // WebCodecs requires the first chunk after configure() to be a keyframe.
  // A joining viewer is sent the cached description before the fresh
  // keyframe is requested, so stale deltas can arrive first: drop them.
  if (needKey && tag !== 2) return;
  if (tag === 2) needKey = false;
  try {
    decoder.decode(new EncodedVideoChunk({ type: tag === 2 ? 'key' : 'delta', timestamp: (seq++) * 1000, data: payload }));
  } catch (e) { err('decode: ' + e.message); }
}
let pendingCodec = '', pendingDesc = null;

function connect() {
  if (!sel || ws) return;
  gotFrame = false; seq = 0; pendingCodec = ''; pendingDesc = null;
  closeDecoder(); // also re-arms needKey
  setStatus('connecting…');
  ws = new WebSocket('ws://' + location.host + '/api/stream?platform=' +
    encodeURIComponent(sel.platform) + '&id=' + encodeURIComponent(sel.id));
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => setStatus('waiting for video…');
  ws.onmessage = ev => {
    if (typeof ev.data === 'string') {
      const m = JSON.parse(ev.data);
      if (m.type === 'meta') {
        streamW = m.width; streamH = m.height; pendingCodec = m.codec || '';
        setStatus('meta ' + streamW + 'x' + streamH + (pendingCodec ? ' ' + pendingCodec : ''));
      }
      return;
    }
    onBinary(new Uint8Array(ev.data));
  };
  ws.onclose = () => { ws = null; setStatus('disconnected'); $('connect').disabled = false; $('disconnect').disabled = true; };
  ws.onerror = () => err('websocket error (is the device booted?)');
  $('connect').disabled = true; $('disconnect').disabled = false;
}
function disconnect() {
  if (ws) { try { ws.close(); } catch (_) {} ws = null; }
  closeDecoder();
  pendingCodec = ''; pendingDesc = null;
  setStatus('disconnected');
  $('connect').disabled = false; $('disconnect').disabled = true;
}
$('connect').onclick = connect;
$('disconnect').onclick = disconnect;

// Canvas gestures → stream-pixel coords → control messages.
function toStream(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.round((e.clientX - r.left) / r.width * streamW),
    y: Math.round((e.clientY - r.top) / r.height * streamH)
  };
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
let down = false;
canvas.addEventListener('pointerdown', e => {
  if (!ws || !streamW) return;
  canvas.setPointerCapture(e.pointerId);
  const p = toStream(e); down = true;
  send({ type: 'touch', action: 'down', x: p.x, y: p.y });
});
canvas.addEventListener('pointermove', e => {
  if (!down || !ws) return;
  const p = toStream(e);
  send({ type: 'touch', action: 'move', x: p.x, y: p.y });
});
canvas.addEventListener('pointerup', e => {
  if (!down) return; down = false;
  const p = toStream(e);
  // A press without prior canvas size is a tap; movement already streamed as moves.
  send({ type: 'touch', action: 'up', x: p.x, y: p.y });
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (!ws || !streamW) return;
  const p = toStream(e);
  send({ type: 'scroll', x: p.x, y: p.y, dx: 0, dy: -Math.sign(e.deltaY) * 16 });
}, { passive: false });
window.addEventListener('keydown', e => {
  if (!ws || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const map = { Enter: 66, Backspace: 67, Escape: 4, Home: 3 };
  if (e.key in map) { send({ type: 'key', code: map[e.key] }); }
  else if (e.key.length === 1) send({ type: 'text', text: e.key });
});

loadDoctor(); loadDevices();
</script>
</body>
</html>
